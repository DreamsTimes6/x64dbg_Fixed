name: Build

on: [push, pull_request]

# Automatically cancel previous runs of this workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Visual Studio Development Environment
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_UNITY_BUILD=ON -DCMAKE_UNITY_BUILD_BATCH_SIZE=6 -DX64DBG_RELEASE=${{ startsWith(github.ref, 'refs/tags/') && 'ON' || 'OFF' }}
          cmake --build build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: bin
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  docs:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build Documentation
        run: |
          docs\makechm.bat

      - name: Upload Documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/x64dbg.chm
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test:
    needs: cmake
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        engine: [TitanEngine, GleeBug]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.arch }}
          path: bin

      - name: Run Tests
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD "test-artifacts/${{ matrix.arch }}-${{ matrix.engine }}"
          $dumpDir = Join-Path $artifactDir "crash-dumps"
          $localDumps = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\headless.exe"
          New-Item -Path $localDumps -Force | Out-Null
          New-ItemProperty -Path $localDumps -Name DumpFolder -Value $dumpDir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $localDumps -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $localDumps -Name DumpCount -Value 4 -PropertyType DWord -Force | Out-Null
          Write-Host "Full headless crash dumps will be written to $dumpDir"
          py src/tests/run.py --arch ${{ matrix.arch }} --engine ${{ matrix.engine }} --artifacts-dir $artifactDir

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.arch }}-${{ matrix.engine }}
          path: test-artifacts/${{ matrix.arch }}-${{ matrix.engine }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  package:
    needs: [cmake, docs]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download x64 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-x64
          path: bin

      - name: Download x86 Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-x86
          path: bin

      - name: Download Documentation
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs

      - name: Prepare Release
        run: |
          curl.exe -L https://github.com/x64dbg/translations/releases/download/translations/qm.zip -o bin\qm.zip
          7z x bin\qm.zip -obin
          # Use our zh_CN translation (includes thread-breakpoint strings) when present in the repo
          if (Test-Path "translations\x64dbg_zh_CN.qm") { Copy-Item "translations\x64dbg_zh_CN.qm" "bin\translations\" -Force }
          cmake -P .\cmake\release.cmake
          $timestamp = Get-Date (Get-Date).ToUniversalTime() -Format "yyyy-MM-dd_HH-mm"
          echo "timestamp=$timestamp" >> $env:GITHUB_ENV

      - name: Upload Snapshot
        uses: actions/upload-artifact@v7
        with:
          name: snapshot_${{ env.timestamp }}
          path: |
            release/pluginsdk
            release/release
            release/commithash.txt
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9

      - name: Upload Symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-snapshot_${{ env.timestamp }}
          path: |
            release/pdb
            release/commithash.txt
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9

      - name: Upload Plugin SDK
        uses: actions/upload-artifact@v7
        with:
          name: x64dbg-pluginsdk
          path: |
            release/pluginsdk
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9

      - name: Create Snapshot Archive
        shell: pwsh
        run: |
          Compress-Archive -Path release\release\* -DestinationPath x64dbg_Fixed-snapshot.zip -Force
          if (Test-Path release\pdb) { Compress-Archive -Path release\pdb\* -DestinationPath x64dbg_Fixed-snapshot-symbols.zip -Force }

      - name: Publish Snapshot Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapshot --yes 2>$null | Out-Null
          $assets = @('x64dbg_Fixed-snapshot.zip')
          if (Test-Path x64dbg_Fixed-snapshot-symbols.zip) { $assets += 'x64dbg_Fixed-snapshot-symbols.zip' }
          $notes = @'
x64dbg_Fixed 自动快照构建（development 分支，x64 + x86）

本包相对官方 x64dbg 的修复与增强：

- 内存断点：region 语义 + 地址不在映射时回退单页 + 武装失败自动降级单页
- 内存断点查找：同页多个断点精确命中
- 数据库：原子写入（.tmp + MoveFileEx），进程被杀不再损坏 .dd32；主库损坏自动回退 .bak
- JIT：取消"设为即时调试器"不再失败（无旧值时清除注册表）
- 单线程步进（选项"单步调试时挂起其他线程"）：step/stepover/stepout/F4 锁定当前线程，其他线程挂起，不再乱跳；run（F9）恢复
- F4 运行到地址优先于已有断点：命中只暂停，不触发普通断点的命令/日志/命中计数；线程级命中（其他线程踩到不暂停）
- 线程断点：断点可绑定指定线程（进程断点/线程断点），右键菜单（当前线程/选择线程/切换）、断点列表类型列 T:线程ID、反汇编图标红点白 T
- 插件菜单命令化（menu_<title>），headless 下可调用插件功能
- headless JSON-RPC（-rpc）：AI/脚本命令行调试接口（ping/get/eval/cmd/wait/exit + sync）
- 界面中文补丁：官方 zh_CN 缺失的选项文本补译

完整说明见仓库 README.md（"Fixes applied in this fork"）。
'@
          gh release create snapshot $assets --title "x64dbg_Fixed snapshot" --notes $notes --latest=false
